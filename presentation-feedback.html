<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EAP 100 Midterm Presentation: Feedback Checklist</title>
<style>
:root{--ink:#17191d;--ink2:#4a4e56;--ink3:#787d86;--paper:#fbfaf6;--rule:#d9d6cc;--red:#a81004;--blue:#22357a;--go:#1f6b4a;--gobg:#eaf3ee;--amber:#f2a81d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:860px;margin:auto;padding:30px 20px 60px}
header{border-bottom:2px solid var(--ink);padding-bottom:16px}
.k{font:700 12px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.05;margin:8px 0 4px;letter-spacing:-.03em}
h2{font-size:1.15rem;margin:0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0 4px}
.meta label,.lbl{font:700 11px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:flex;flex-direction:column;gap:4px}
input[type=text],textarea{font:inherit;font-size:15px;border:1px solid var(--rule);background:#fff;padding:7px 9px;border-radius:3px;width:100%}
textarea{min-height:56px;resize:vertical}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;min-height:40px;background:var(--ink);color:#fff;padding:8px 13px;font:700 12px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--ink);cursor:pointer;border-radius:3px;text-decoration:none}
.btn.alt{background:#fff;color:var(--ink)}
.hint{font-size:14px;color:var(--ink2);margin:14px 0 0}
.sec{background:#fff;border:1px solid var(--rule);border-radius:5px;margin:16px 0;overflow:hidden;break-inside:avoid-page}
.sec-h{display:flex;align-items:center;gap:12px;padding:11px 16px;background:#f4f2ec;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.sec-h .n{font:700 13px ui-monospace,monospace;color:var(--red)}
.bands{margin-left:auto;display:flex;gap:4px}
.bands label{font:700 12px ui-monospace,monospace;border:1px solid var(--rule);border-radius:3px;padding:4px 9px;cursor:pointer;background:#fff}
.bands input{position:absolute;opacity:0}
.bands label:has(input:checked){background:var(--go);border-color:var(--go);color:#fff}
.item{padding:8px 16px;border-top:1px solid #eeebe4}
.item:first-of-type{border-top:0}
.item label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600}
.item input{width:18px;height:18px;margin-top:2px;flex-shrink:0}
.tip{margin:3px 0 0 28px;font-size:14px;color:var(--blue)}
.tip::before{content:"Try: ";font-weight:700}
.item.met .tip{display:none}
.item.met label{color:var(--go)}
.sum{background:#fff;border:2px solid var(--ink);border-radius:5px;padding:16px;margin-top:22px;display:grid;gap:12px}
:where(a,button,input,textarea,label):focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media print{.no-print{display:none!important}body{background:#fff;font-size:12.5px}main{padding:0;max-width:none}input[type=text],textarea{border:0;border-bottom:1px solid #999;padding:2px 0}textarea{min-height:36px}.bands label:has(input:checked){background:#000}}
</style>
</head>
<body>
<main id="main-content">
<header>
<div class="k">NYU Shanghai &middot; English for Academic Purposes &middot; Fall 2026</div>
<h1>Midterm Presentation Feedback</h1>
<p>Informative Presentation (20%) &middot; 3&ndash;4 minutes</p>
<div class="meta">
<label>Student<input type="text"></label>
<label>Topic<input type="text"></label>
<label>Time taken<input type="text" placeholder="e.g. 3:42"></label>
</div>
<div class="bar no-print">
<button class="btn" onclick="window.print()">Print / PDF</button>
<button class="btn alt" id="reset">Clear</button>
<a class="btn alt" href="index.html#week7">Back to Week 7</a>
</div>
<p class="hint no-print">Tick what the speaker did. Unticked items keep a tip. Pick a band (A&ndash;D) per criterion.</p>
</header>
<div id="secs"></div>
<section class="sum" aria-label="Summary">
<label class="lbl">Keep doing<textarea></textarea></label>
<label class="lbl">Work on before the Persuasive Speech (Tue Nov 24)<textarea></textarea></label>
</section>
</main>
<script>
var S=[
{t:"Task",band:false,items:[
["Stayed within 3&ndash;4 minutes","Rehearse twice with a timer."],
["Used 2&ndash;3 sources, cited aloud","&ldquo;According to [who], in [year]&hellip;&rdquo;"],
["Showed 3 visual aids","One visual per main point."],
["Answered an audience question","Paraphrase, answer in 2&ndash;3 sentences."]
]},
{t:"Organization",items:[
["Hook, topic and preview in the intro","Open with a question or statistic, not &ldquo;My topic is&hellip;&rdquo;"],
["2&ndash;4 clear main points with transitions","&ldquo;Moving on to my second point&hellip;&rdquo;"],
["Clear conclusion and final thought","Signal the end, recap, link back to the hook."]
]},
{t:"Language",items:[
["Precise, academic word choice","Swap &ldquo;things/a lot&rdquo; for specific words."],
["Short, clear spoken sentences","Break long sentences in two."],
["Key terms defined and pronounced clearly","Check word stress in a dictionary."]
]},
{t:"Delivery",items:[
["Eye contact with the whole room","Keyword cue cards only, no script."],
["Clear voice, steady pace, few fillers","Pause instead of &ldquo;um&rdquo;."],
["Confident posture and gestures","Feet planted, face the audience."]
]},
{t:"Supporting Material",items:[
["Readable visuals that add to the talk","24pt+, images over text."],
["Evidence explained and linked to the point","&ldquo;This shows that&hellip;&rdquo;"],
["(Author, Year) on slides + APA 7 references","Check each entry against the APA guide."]
]},
{t:"Central Message",items:[
["Message stated in one sentence early","Write the sentence before the slides."],
["Every point supports it; restated at the end","Cut anything off-message."]
]}
];
var h="",id=0;
S.forEach(function(s,i){h+='<section class="sec"><div class="sec-h"><span class="n">0'+i+'</span><h2>'+s.t+'</h2>';
if(s.band!==false){h+='<div class="bands" role="radiogroup" aria-label="'+s.t+' band">'+["A","B","C","D"].map(function(L){return'<label><input type="radio" name="b'+i+'" value="'+L+'">'+L+'</label>'}).join("")+'</div>'}
h+='</div>';s.items.forEach(function(it){id++;h+='<div class="item"><label><input type="checkbox" id="c'+id+'"><span>'+it[0]+'</span></label><div class="tip">'+it[1]+'</div></div>'});h+='</section>'});
document.getElementById("secs").innerHTML=h;
document.addEventListener("change",function(e){if(e.target.type==="checkbox")e.target.closest(".item").classList.toggle("met",e.target.checked)});
document.getElementById("reset").addEventListener("click",function(){if(!confirm("Clear everything?"))return;document.querySelectorAll("input[type=checkbox],input[type=radio]").forEach(function(x){x.checked=false});document.querySelectorAll("input[type=text],textarea").forEach(function(x){x.value=""});document.querySelectorAll(".item").forEach(function(x){x.classList.remove("met")});window.scrollTo(0,0)});
</script>
</body>
</html>
